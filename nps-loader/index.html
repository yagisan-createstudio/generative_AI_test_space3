<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#fff0f3">
  <title>NPS｜読み込み画面のプレビュー</title>
  <style>
    :root {
      color-scheme: light;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #334155;
      background: #fff0f3;
    }
    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100svh;
      display: grid;
      place-items: center;
    }
    main {
      display: grid;
      justify-items: center;
    }
    .wordmark {
      width: min(64vw, 280px);
      height: auto;
      overflow: visible;
    }
    .wordmark path {
      fill: none;
      stroke: #b80946;
      stroke-width: 18;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .wordmark .mouth { fill: #b80946; stroke: none; }
    .mouth-reveal {
      transform-box: fill-box;
      transform-origin: left center;
    }
    .drawing .mouth-reveal {
      animation: reveal-mouth .68s cubic-bezier(.42, 0, .24, 1) 2.04s both;
    }
    @keyframes reveal-mouth {
      from { transform: scaleX(0); }
      to { transform: scaleX(1); }
    }
    .drawing path[pathLength] {
      stroke-dasharray: 1;
      animation: write-letter var(--duration, .88s) cubic-bezier(.42, 0, .24, 1) both;
      animation-delay: var(--delay, 0s);
    }
    @keyframes write-letter {
      from { stroke-dashoffset: 1; opacity: 0; }
      4% { opacity: 1; }
      to { stroke-dashoffset: 0; opacity: 1; }
    }
    .status {
      margin: 22px 0 0;
      color: #64748b;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: .04em;
    }
    .controls {
      position: fixed;
      inset: auto 0 calc(24px + env(safe-area-inset-bottom, 0px));
      display: grid;
      justify-items: center;
      gap: 8px;
    }
    .controls span { color: #64748b; font-size: 11px; }
    button {
      min-height: 44px;
      padding: 0 16px;
      color: #334155;
      background: #fff;
      border: 1px solid #d5dbe2;
      border-radius: 999px;
      font: inherit;
      font-size: 13px;
      cursor: pointer;
    }
    button:focus-visible { outline: 2px solid #b80946; outline-offset: 4px; }
    @media (prefers-reduced-motion: reduce) {
      .drawing path[pathLength] { animation: none; stroke-dasharray: none; }
      .drawing .mouth-reveal { animation: none; }
    }
  </style>
</head>
<body>
  <main>
    <svg class="wordmark drawing" viewBox="0 0 274 167" role="img" aria-label="NPS">
      <path pathLength="1" d="M 28,83 V 23 L 80,83 V 23"/>
      <path pathLength="1" style="--delay: .68s" d="M 110,83 V 23 H 135 C 153,23 163,30 163,43 C 163,56 153,63 135,63 H 110"/>
      <path pathLength="1" style="--delay: 1.36s" d="M 244,29 C 226,17 197,20 192,34 C 185,54 235,48 242,66 C 250,85 209,94 188,79"/>
      <defs>
        <clipPath id="mouth-reveal">
          <rect class="mouth-reveal" x="61" y="98" width="150" height="57"/>
        </clipPath>
      </defs>
      <path class="mouth" clip-path="url(#mouth-reveal)" d="M 73.94,101.15 C 77.01,100.93 79.75,102.26 82.32,104.23 C 84.90,106.21 87.32,108.82 89.76,111.18 C 92.20,113.54 94.68,115.56 97.25,117.29 C 99.81,119.02 102.47,120.47 105.25,121.74 C 108.04,123.01 110.98,124.10 114.03,125.03 C 117.08,125.96 120.24,126.71 123.45,127.28 C 126.66,127.84 129.93,128.21 133.20,128.38 C 136.48,128.54 139.75,128.51 142.98,128.25 C 146.21,127.99 149.39,127.50 152.48,126.79 C 155.56,126.07 158.53,125.11 161.41,123.93 C 164.29,122.75 167.07,121.36 169.78,119.80 C 172.50,118.24 175.15,116.50 177.75,114.62 C 180.35,112.74 182.91,110.73 185.45,108.61 C 188.00,106.50 190.48,104.03 193.09,102.25 C 195.70,100.46 198.68,99.96 201.72,101.65 C 204.77,103.35 207.37,106.52 207.99,109.35 C 208.60,112.18 207.63,114.98 205.90,117.66 C 204.16,120.35 201.67,122.91 199.20,125.28 C 196.74,127.65 194.25,129.83 191.71,131.82 C 189.18,133.82 186.60,135.64 183.96,137.29 C 181.32,138.94 178.61,140.42 175.83,141.74 C 173.05,143.07 170.20,144.24 167.24,145.26 C 164.29,146.28 161.23,147.16 158.11,147.90 C 154.98,148.63 151.79,149.21 148.55,149.65 C 145.32,150.08 142.06,150.36 138.79,150.48 C 135.52,150.59 132.25,150.55 129.01,150.35 C 125.78,150.14 122.58,149.77 119.44,149.23 C 116.31,148.69 113.25,147.98 110.26,147.10 C 107.27,146.22 104.35,145.18 101.48,143.98 C 98.62,142.79 95.81,141.44 93.04,139.95 C 90.27,138.45 87.55,136.82 84.86,135.05 C 82.16,133.29 79.49,131.39 76.87,129.37 C 74.24,127.34 71.73,125.15 69.62,122.69 C 67.51,120.23 65.77,117.43 64.83,114.37 C 63.89,111.30 63.86,108.10 65.66,105.62 C 67.46,103.14 70.87,101.37 73.94,101.15 Z"/>
    </svg>
    <p class="status">リダイレクト中…</p>
  </main>
  <div class="controls">
    <span>読み込み画面のデザイン確認</span>
    <button type="button" id="replay">もう一度再生</button>
  </div>
  <script>
    const wordmark = document.querySelector('.wordmark');
    document.getElementById('replay').addEventListener('click', () => {
      wordmark.classList.remove('drawing');
      wordmark.getBoundingClientRect();
      wordmark.classList.add('drawing');
    });
  </script>
</body>
</html>
