<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#fff0f3">
  <title>NPS｜読み込み画面のプレビュー</title>
  <style>
    :root {
      color-scheme: light;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #334155;
      background: #fff0f3;
    }
    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100svh;
      display: grid;
      place-items: center;
    }
    main {
      display: grid;
      justify-items: center;
    }
    .wordmark {
      width: min(64vw, 280px);
      height: auto;
      overflow: visible;
    }
    .wordmark path {
      fill: none;
      stroke: #b80946;
      stroke-width: 18;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .wordmark .eye {
      fill: #fff;
      stroke: #800833;
      stroke-width: 1.6;
    }
    .wordmark .pupil { fill: #590c2b; }
    .wordmark .mouth {
      fill: #b80946;
      stroke-width: 5;
    }
    .drawing path {
      stroke-dasharray: 1;
      animation: write-letter var(--duration, .88s) cubic-bezier(.42, 0, .24, 1) both;
      animation-delay: var(--delay, 0s);
    }
    .drawing .pupil { animation: appear .22s ease 2.46s both; }
    .drawing .mouth {
      animation-name: write-letter, fill-mouth;
      animation-duration: .74s, .25s;
      animation-delay: 2.04s, 2.57s;
    }
    @keyframes appear {
      from { opacity: 0; }
      to { opacity: 1; }
    }
    @keyframes fill-mouth {
      from { fill-opacity: 0; }
      to { fill-opacity: 1; }
    }
    @keyframes write-letter {
      from { stroke-dashoffset: 1; opacity: 0; }
      4% { opacity: 1; }
      to { stroke-dashoffset: 0; opacity: 1; }
    }
    .status {
      margin: 22px 0 0;
      color: #64748b;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: .04em;
    }
    .controls {
      position: fixed;
      inset: auto 0 calc(24px + env(safe-area-inset-bottom, 0px));
      display: grid;
      justify-items: center;
      gap: 8px;
    }
    .controls span { color: #64748b; font-size: 11px; }
    button {
      min-height: 44px;
      padding: 0 16px;
      color: #334155;
      background: #fff;
      border: 1px solid #d5dbe2;
      border-radius: 999px;
      font: inherit;
      font-size: 13px;
      cursor: pointer;
    }
    button:focus-visible { outline: 2px solid #b80946; outline-offset: 4px; }
    @media (prefers-reduced-motion: reduce) {
      .drawing path, .drawing .pupil, .drawing .mouth { animation: none; stroke-dasharray: none; }
    }
  </style>
</head>
<body>
  <main>
    <svg class="wordmark drawing" viewBox="0 0 274 167" role="img" aria-label="NPS">
      <path pathLength="1" d="M 28,83 V 23 L 80,83 V 23"/>
      <path pathLength="1" style="--delay: .68s" d="M 110,83 V 23 H 135 C 153,23 163,30 163,43 C 163,56 153,63 135,63 H 110"/>
      <path pathLength="1" style="--delay: 1.36s" d="M 244,29 C 226,17 197,20 192,34 C 185,54 235,48 242,66 C 250,85 209,94 188,79"/>
      <g aria-hidden="true">
        <path class="eye" pathLength="1" style="--delay: 2.05s; --duration: .35s"
          d="M 127,35.5 C 134,35.5 134,50.5 127,50.5 C 120,50.5 120,35.5 127,35.5 Z"/>
        <path class="eye" pathLength="1" style="--delay: 2.12s; --duration: .35s"
          d="M 141,35.5 C 148,35.5 148,50.5 141,50.5 C 134,50.5 134,35.5 141,35.5 Z"/>
        <ellipse class="pupil" cx="128.5" cy="44" rx="2.55" ry="3.8"/>
        <ellipse class="pupil" cx="142.5" cy="44" rx="2.55" ry="3.8"/>
      </g>
      <path class="mouth" pathLength="1"
        d="M 65,108 Q 137,122 209,108 C 197,138 170,151 137,151 C 104,151 77,138 65,108 Z"/>
    </svg>
    <p class="status">リダイレクト中…</p>
  </main>
  <div class="controls">
    <span>読み込み画面のデザイン確認</span>
    <button type="button" id="replay">もう一度再生</button>
  </div>
  <script>
    const wordmark = document.querySelector('.wordmark');
    document.getElementById('replay').addEventListener('click', () => {
      wordmark.classList.remove('drawing');
      wordmark.getBoundingClientRect();
      wordmark.classList.add('drawing');
    });
  </script>
</body>
</html>
