<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f7f7f4">
  <title>NPS｜読み込み画面のプレビュー</title>
  <style>
    :root {
      color-scheme: light;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #334155;
      background: #f7f7f4;
    }
    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100svh;
      display: grid;
      place-items: center;
    }
    main {
      display: grid;
      justify-items: center;
    }
    .wordmark {
      width: min(64vw, 280px);
      height: auto;
      overflow: visible;
    }
    .wordmark path {
      fill: none;
      stroke: url(#ink);
      stroke-width: 13;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .drawing path {
      stroke-dasharray: 1;
      animation: write-letter 1.05s cubic-bezier(.42, 0, .24, 1) both;
      animation-delay: var(--delay, 0s);
    }
    @keyframes write-letter {
      from { stroke-dashoffset: 1; opacity: 0; }
      4% { opacity: 1; }
      to { stroke-dashoffset: 0; opacity: 1; }
    }
    .status {
      margin: 22px 0 0;
      color: #64748b;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: .04em;
    }
    .controls {
      position: fixed;
      inset: auto 0 calc(24px + env(safe-area-inset-bottom, 0px));
      display: grid;
      justify-items: center;
      gap: 8px;
    }
    .controls span { color: #64748b; font-size: 11px; }
    button {
      min-height: 44px;
      padding: 0 16px;
      color: #334155;
      background: #fff;
      border: 1px solid #d5dbe2;
      border-radius: 999px;
      font: inherit;
      font-size: 13px;
      cursor: pointer;
    }
    button:focus-visible { outline: 2px solid #544fd6; outline-offset: 4px; }
    @media (prefers-reduced-motion: reduce) {
      .drawing path { animation: none; stroke-dasharray: none; }
    }
  </style>
</head>
<body>
  <main>
    <svg class="wordmark drawing" viewBox="0 0 274 112" role="img" aria-label="NPS">
      <defs>
        <linearGradient id="ink" gradientUnits="userSpaceOnUse" x1="12" y1="94" x2="258" y2="23">
          <stop offset="0" stop-color="#007fd7"/>
          <stop offset=".35" stop-color="#5058e5"/>
          <stop offset=".67" stop-color="#9b46dc"/>
          <stop offset="1" stop-color="#e64585"/>
        </linearGradient>
      </defs>
      <path pathLength="1" d="M 22,92 C 28,70 33,44 41,22 C 52,42 63,65 76,85 C 84,67 89,39 96,20"/>
      <path pathLength="1" style="--delay: .82s" d="M 109,93 C 116,68 121,43 127,22 C 151,15 177,18 174,36 C 171,53 151,60 123,57"/>
      <path pathLength="1" style="--delay: 1.64s" d="M 252,27 C 235,12 203,19 198,37 C 193,53 229,53 234,68 C 242,92 197,102 179,88"/>
    </svg>
    <p class="status">リダイレクト中…</p>
  </main>
  <div class="controls">
    <span>読み込み画面のデザイン確認</span>
    <button type="button" id="replay">もう一度再生</button>
  </div>
  <script>
    const wordmark = document.querySelector('.wordmark');
    document.getElementById('replay').addEventListener('click', () => {
      wordmark.classList.remove('drawing');
      wordmark.getBoundingClientRect();
      wordmark.classList.add('drawing');
    });
  </script>
</body>
</html>
