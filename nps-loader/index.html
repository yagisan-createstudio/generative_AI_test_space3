<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#fff0f3">
  <title>NPS｜読み込み画面のプレビュー</title>
  <style>
    :root {
      color-scheme: light;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #334155;
      background: #fff0f3;
    }
    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100svh;
      display: grid;
      place-items: center;
    }
    main {
      display: grid;
      justify-items: center;
    }
    .wordmark {
      width: min(64vw, 280px);
      height: auto;
      overflow: visible;
    }
    .wordmark path {
      fill: none;
      stroke: #b80946;
      stroke-width: 19;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .wordmark .viewer { stroke-width: 7; }
    .wordmark .smile { stroke-width: 9; }
    .drawing path {
      stroke-dasharray: 1;
      animation: write-letter var(--duration, .88s) cubic-bezier(.42, 0, .24, 1) both;
      animation-delay: var(--delay, 0s);
    }
    @keyframes write-letter {
      from { stroke-dashoffset: 1; opacity: 0; }
      4% { opacity: 1; }
      to { stroke-dashoffset: 0; opacity: 1; }
    }
    .status {
      margin: 22px 0 0;
      color: #64748b;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: .04em;
    }
    .controls {
      position: fixed;
      inset: auto 0 calc(24px + env(safe-area-inset-bottom, 0px));
      display: grid;
      justify-items: center;
      gap: 8px;
    }
    .controls span { color: #64748b; font-size: 11px; }
    button {
      min-height: 44px;
      padding: 0 16px;
      color: #334155;
      background: #fff;
      border: 1px solid #d5dbe2;
      border-radius: 999px;
      font: inherit;
      font-size: 13px;
      cursor: pointer;
    }
    button:focus-visible { outline: 2px solid #b80946; outline-offset: 4px; }
    @media (prefers-reduced-motion: reduce) {
      .drawing path { animation: none; stroke-dasharray: none; }
    }
  </style>
</head>
<body>
  <main>
    <svg class="wordmark drawing" viewBox="0 0 274 197" role="img" aria-label="NPS Viewer">
      <path pathLength="1" d="M 28,83 V 23 L 80,83 V 23"/>
      <path pathLength="1" style="--delay: .68s" d="M 110,83 V 23 H 135 C 153,23 163,30 163,43 C 163,56 153,63 135,63 H 110"/>
      <path pathLength="1" style="--delay: 1.36s" d="M 244,29 C 226,17 197,20 192,34 C 185,54 235,48 242,66 C 250,85 209,94 188,79"/>
      <g class="viewer" style="--duration: .48s">
        <path pathLength="1" style="--delay: 2.08s" d="M 50,111 L 64,143 L 78,111"/>
        <path pathLength="1" style="--delay: 2.21s" d="M 89,124 V 143"/>
        <path pathLength="1" style="--delay: 2.45s; --duration: .16s" d="M 89,113 h .1"/>
        <path pathLength="1" style="--delay: 2.33s" d="M 102,134 H 120 C 120,118 101,120 101,133 C 101,146 113,147 121,141"/>
        <path pathLength="1" style="--delay: 2.46s" d="M 130,124 L 137,143 L 145,128 L 153,143 L 160,124"/>
        <path pathLength="1" style="--delay: 2.59s" d="M 170,134 H 188 C 188,118 169,120 169,133 C 169,146 181,147 189,141"/>
        <path pathLength="1" style="--delay: 2.72s" d="M 202,143 V 124 M 202,134 C 205,126 210,123 218,124"/>
      </g>
      <path class="smile" pathLength="1" style="--delay: 3.12s; --duration: .58s" d="M 85,164 C 111,190 163,190 189,164"/>
    </svg>
    <p class="status">リダイレクト中…</p>
  </main>
  <div class="controls">
    <span>読み込み画面のデザイン確認</span>
    <button type="button" id="replay">もう一度再生</button>
  </div>
  <script>
    const wordmark = document.querySelector('.wordmark');
    document.getElementById('replay').addEventListener('click', () => {
      wordmark.classList.remove('drawing');
      wordmark.getBoundingClientRect();
      wordmark.classList.add('drawing');
    });
  </script>
</body>
</html>
